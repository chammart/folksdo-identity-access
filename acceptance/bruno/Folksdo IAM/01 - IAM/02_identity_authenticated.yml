info:
  name: IAM — Identity Authenticated Actor
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/identity/me"
  headers:
    - name: Accept
      value: "application/json"
    - name: Authorization
      value: "Bearer {{administratorSessionId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Identity authenticates the prepared actor", () => {
          expect(res.getStatus()).to.equal(200);
          expect(res.body.userId).to.equal(bru.getEnvVar("administratorIdentityId"));
          expect(res.body.email).to.equal(bru.getEnvVar("administratorEmail"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
