info:
  name: IAM — Membership Context
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/membership/current"
  headers:
    - name: Accept
      value: "application/json"
    - name: Authorization
      value: "Bearer {{administratorSessionId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Membership resolves authoritative active context", () => {
          expect(res.getStatus()).to.equal(200);
          expect(res.body.identityId).to.equal(bru.getEnvVar("administratorIdentityId"));
          expect(res.body.activeMembershipId).to.equal(bru.getEnvVar("administratorMembershipId"));
          expect(res.body.activeTenantId).to.equal(bru.getEnvVar("administratorTenantId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
