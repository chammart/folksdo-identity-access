info:
  name: IAM — Runtime Ready
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/health/ready"
  headers:
    - name: Accept
      value: "application/json"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("IAM runtime is ready", () => {
          expect(res.getStatus()).to.equal(200);
          expect(res.body.status).to.equal("ready");
          expect(res.body.dependencies.platformRuntime).to.equal(true);
          expect(res.body.dependencies.accessRuntime).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
