name: Promote Certified Folksdo Operations Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable staging-certified image tag
        required: true
        type: string
      source_commit:
        description: Certified source commit SHA
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: folksdo-operations-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/chammart/folksdo-operations
  DEPLOY_PATH_SUFFIX: folksdo-operations-production
  COMPOSE_PROJECT_NAME: folksdo-operations-production
  HEALTH_URL: http://127.0.0.1:3001/health
  READY_URL: http://127.0.0.1:3001/ready

jobs:
  verify-certified-image:
    name: Verify Certified Image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate immutable staging tag
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.image_tag }}" in
            staging-*) ;;
            *) echo "Only an immutable staging-certified tag may be promoted."; exit 1 ;;
          esac
          if [ -z "${{ inputs.source_commit }}" ]; then
            echo "source_commit is required."
            exit 1
          fi

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: verify-certified-image
    environment:
      name: production
      url: https://nexacore.folksdo.com
    steps:
      - name: Checkout certified source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}

      - name: Upload production Compose definition
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: docker-compose.production.yml
          target: ${{ secrets.VPS_DEPLOY_ROOT }}/${{ env.DEPLOY_PATH_SUFFIX }}
          overwrite: true

      - name: Deploy exact certified image
        uses: appleboy/ssh-action@v1.2.0
        env:
          VPS_DEPLOY_ROOT: ${{ secrets.VPS_DEPLOY_ROOT }}
          DEPLOY_PATH_SUFFIX: ${{ env.DEPLOY_PATH_SUFFIX }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          COMPOSE_PROJECT: ${{ env.COMPOSE_PROJECT_NAME }}
          HEALTH_URL: ${{ env.HEALTH_URL }}
          READY_URL: ${{ env.READY_URL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          command_timeout: 20m
          script_stop: true
          envs: VPS_DEPLOY_ROOT,DEPLOY_PATH_SUFFIX,IMAGE_TAG,COMPOSE_PROJECT,HEALTH_URL,READY_URL
          script: |
            set -euo pipefail
            DEPLOY_PATH="${VPS_DEPLOY_ROOT}/${DEPLOY_PATH_SUFFIX}"
            cd "${DEPLOY_PATH}"
            test -f .env
            test -f docker-compose.production.yml || test -f docker-compose.yml
            sed -i.bak -E "s|^FOLKSDO_OPERATIONS_IMAGE_TAG=.*$|FOLKSDO_OPERATIONS_IMAGE_TAG=${IMAGE_TAG}|" .env
            COMPOSE_FILE=docker-compose.production.yml
            [ -f "$COMPOSE_FILE" ] || COMPOSE_FILE=docker-compose.yml
            docker compose --project-name "${COMPOSE_PROJECT}" --file "$COMPOSE_FILE" pull
            docker compose --project-name "${COMPOSE_PROJECT}" --file "$COMPOSE_FILE" up -d --remove-orphans
            for attempt in $(seq 1 60); do curl --fail --silent "$HEALTH_URL" >/dev/null && break; sleep 5; done
            curl --fail --silent "$HEALTH_URL" >/dev/null
            curl --fail --silent "$READY_URL" >/dev/null

  production-smoke:
    name: Production Smoke
    runs-on: ubuntu-latest
    needs: deploy-production
    environment: production
    steps:
      - name: Checkout certified source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.5.2"
      - name: Run non-destructive Operations smoke
        env:
          PRODUCTION_BASE_URL: https://nexacore.folksdo.com
          PRODUCTION_SMOKE_TIMEOUT_MILLISECONDS: "15000"
        run: pnpm smoke:production:operations
