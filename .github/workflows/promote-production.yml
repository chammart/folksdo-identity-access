name: Promote Certified Folksdo IAM Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable staging-certified IAM image tag
        required: true
        type: string
      source_commit:
        description: Certified source commit SHA
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: folksdo-iam-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/chammart/folksdo-identity-access
  DEPLOY_PATH_SUFFIX: folksdo-iam-production
  COMPOSE_PROJECT_NAME: folksdo-identity-access-production
  HEALTH_URL: http://127.0.0.1:3100/health/live
  READY_URL: http://127.0.0.1:3100/health/ready

jobs:
  verify-certified-image:
    name: Verify Certified Image
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Validate immutable staging tag
        shell: bash
        run: |
          set -euo pipefail

          case "${{ inputs.image_tag }}" in
            staging-*) ;;
            *)
              echo "Only an immutable staging-certified IAM image may be promoted."
              exit 1
              ;;
          esac

          if [ -z "${{ inputs.source_commit }}" ]; then
            echo "source_commit is required."
            exit 1
          fi

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: verify-certified-image

    environment:
      name: production
      url: ${{ vars.IAM_PRODUCTION_BASE_URL }}

    steps:
      - name: Checkout certified source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}

      - name: Upload production Compose definition
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: docker-compose.production.yml
          target: ${{ secrets.VPS_DEPLOY_ROOT }}/${{ env.DEPLOY_PATH_SUFFIX }}
          overwrite: true

      - name: Deploy exact certified image
        uses: appleboy/ssh-action@v1.2.0
        env:
          VPS_DEPLOY_ROOT: ${{ secrets.VPS_DEPLOY_ROOT }}
          DEPLOY_PATH_SUFFIX: ${{ env.DEPLOY_PATH_SUFFIX }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          COMPOSE_PROJECT: ${{ env.COMPOSE_PROJECT_NAME }}
          HEALTH_URL: ${{ env.HEALTH_URL }}
          READY_URL: ${{ env.READY_URL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          command_timeout: 20m
          script_stop: true
          envs: VPS_DEPLOY_ROOT,DEPLOY_PATH_SUFFIX,IMAGE_TAG,COMPOSE_PROJECT,HEALTH_URL,READY_URL
          script: |
            set -euo pipefail

            DEPLOY_PATH="${VPS_DEPLOY_ROOT}/${DEPLOY_PATH_SUFFIX}"

            test -d "${DEPLOY_PATH}"
            cd "${DEPLOY_PATH}"

            test -f .env
            test -s .env
            test -f docker-compose.production.yml

            mv -f docker-compose.production.yml docker-compose.yml

            if grep -q '^FOLKSDO_IAM_IMAGE_TAG=' .env; then
              sed -i \
                "s|^FOLKSDO_IAM_IMAGE_TAG=.*|FOLKSDO_IAM_IMAGE_TAG=${IMAGE_TAG}|" \
                .env
            else
              printf \
                '\nFOLKSDO_IAM_IMAGE_TAG=%s\n' \
                "${IMAGE_TAG}" >> .env
            fi

            docker compose \
              --project-name "${COMPOSE_PROJECT}" \
              config --quiet

            docker compose \
              --project-name "${COMPOSE_PROJECT}" \
              pull

            docker compose \
              --project-name "${COMPOSE_PROJECT}" \
              up -d --remove-orphans

            for URL in "${HEALTH_URL}" "${READY_URL}"; do
              passed=false

              for attempt in $(seq 1 30); do
                if curl \
                  --fail \
                  --silent \
                  --show-error \
                  "${URL}" >/dev/null; then
                  passed=true
                  break
                fi

                sleep 5
              done

              if [ "${passed}" != "true" ]; then
                docker compose \
                  --project-name "${COMPOSE_PROJECT}" \
                  ps

                docker compose \
                  --project-name "${COMPOSE_PROJECT}" \
                  logs --tail=200 api

                exit 1
              fi
            done

            docker compose \
              --project-name "${COMPOSE_PROJECT}" \
              ps

  production-smoke:
    name: Production Smoke
    runs-on: ubuntu-latest
    needs: deploy-production

    environment:
      name: production
      url: ${{ vars.IAM_PRODUCTION_BASE_URL }}

    steps:
      - name: Verify public production IAM
        shell: bash
        env:
          PRODUCTION_BASE_URL: ${{ vars.IAM_PRODUCTION_BASE_URL }}
        run: |
          set -euo pipefail

          test -n "${PRODUCTION_BASE_URL}"

          curl \
            --fail \
            --silent \
            --show-error \
            "${PRODUCTION_BASE_URL}/health/live" \
            >/dev/null

          curl \
            --fail \
            --silent \
            --show-error \
            "${PRODUCTION_BASE_URL}/health/ready" \
            >/dev/null

          echo "Folksdo IAM production smoke passed."