name: Promote Certified Folksdo IAM Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read

concurrency:
  group: folksdo-iam-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/chammart/folksdo-identity-access
  DEPLOY_PATH_SUFFIX: folksdo-iam-production
  COMPOSE_PROJECT_NAME: folksdo-identity-access-production
  HEALTH_URL: http://127.0.0.1:3100/health/live
  READY_URL: http://127.0.0.1:3100/health/ready

jobs:
  resolve-certified-release:
    name: Resolve Certified Staging Release
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.release.outputs.image_tag }}
      image_ref: ${{ steps.release.outputs.image_ref }}
      image_digest: ${{ steps.release.outputs.image_digest }}
      source_commit: ${{ steps.release.outputs.source_commit }}

    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve staging-certified ancestor
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -rf .certified-release
          mkdir -p .certified-release

          FOUND=false

          while IFS=$'\t' read -r RUN_ID HEAD_SHA; do
            if [ -z "${RUN_ID}" ] || [ -z "${HEAD_SHA}" ]; then
              continue
            fi

            if ! git merge-base --is-ancestor "${HEAD_SHA}" "${GITHUB_SHA}"; then
              continue
            fi

            ARTIFACT_NAME="staging-certified-release-${HEAD_SHA}"

            rm -rf .certified-release/*
            mkdir -p .certified-release

            if ! gh run download "${RUN_ID}" \
              --name "${ARTIFACT_NAME}" \
              --dir .certified-release; then
              continue
            fi

            RELEASE_FILE=".certified-release/staging-certified-release.json"

            if [ ! -s "${RELEASE_FILE}" ]; then
              continue
            fi

            SOURCE_COMMIT="$(jq -r '.sourceCommit // empty' "${RELEASE_FILE}")"
            IMAGE_TAG="$(jq -r '.image.tag // empty' "${RELEASE_FILE}")"
            IMAGE_REF="$(jq -r '.image.ref // empty' "${RELEASE_FILE}")"
            IMAGE_DIGEST="$(jq -r '.image.digest // empty' "${RELEASE_FILE}")"

            if [ "${SOURCE_COMMIT}" != "${HEAD_SHA}" ]; then
              echo "Certified release source commit mismatch."
              exit 1
            fi

            case "${IMAGE_TAG}" in
              staging-*) ;;
              *)
                echo "Certified release does not reference an immutable staging image."
                exit 1
                ;;
            esac

            EXPECTED_REF="${IMAGE_NAME}:${IMAGE_TAG}"

            if [ "${IMAGE_REF}" != "${EXPECTED_REF}" ]; then
              echo "Certified release image reference mismatch."
              exit 1
            fi

            if [ -z "${IMAGE_DIGEST}" ]; then
              echo "Certified release image digest is missing."
              exit 1
            fi

            echo "source_commit=${SOURCE_COMMIT}" >> "${GITHUB_OUTPUT}"
            echo "image_tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"
            echo "image_ref=${IMAGE_REF}" >> "${GITHUB_OUTPUT}"
            echo "image_digest=${IMAGE_DIGEST}" >> "${GITHUB_OUTPUT}"

            echo "Resolved certified staging release:"
            echo "  Source commit: ${SOURCE_COMMIT}"
            echo "  Image: ${IMAGE_REF}"
            echo "  Digest: ${IMAGE_DIGEST}"

            FOUND=true
            break
          done < <(
            gh run list \
              --workflow deploy-staging.yml \
              --branch develop \
              --status success \
              --limit 50 \
              --json databaseId,headSha \
              --jq '.[] | [.databaseId, .headSha] | @tsv'
          )

          if [ "${FOUND}" != "true" ]; then
            echo "No staging-certified release is an ancestor of ${GITHUB_SHA}."
            echo "Production promotion is blocked."
            exit 1
          fi

      - name: Production promotion summary
        shell: bash
        run: |
          {
            echo "## Folksdo IAM Certified Promotion"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Main Commit | ${{ github.sha }} |"
            echo "| Certified Source | ${{ steps.release.outputs.source_commit }} |"
            echo "| Image | ${{ steps.release.outputs.image_ref }} |"
            echo "| Digest | ${{ steps.release.outputs.image_digest }} |"
          } >> "${GITHUB_STEP_SUMMARY}"

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: resolve-certified-release

    environment:
      name: production
      url: ${{ vars.IAM_PRODUCTION_BASE_URL }}

    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

 
      - name: Deploy exact certified image
        uses: appleboy/ssh-action@v1.2.0
        env:
          VPS_DEPLOY_ROOT: ${{ secrets.VPS_DEPLOY_ROOT }}
          DEPLOY_PATH_SUFFIX: ${{ env.DEPLOY_PATH_SUFFIX }}
          IMAGE_TAG: ${{ needs.resolve-certified-release.outputs.image_tag }}
          COMPOSE_PROJECT: ${{ env.COMPOSE_PROJECT_NAME }}
          HEALTH_URL: ${{ env.HEALTH_URL }}
          READY_URL: ${{ env.READY_URL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          command_timeout: 20m
          script_stop: true
          envs: VPS_DEPLOY_ROOT,DEPLOY_PATH_SUFFIX,IMAGE_TAG,COMPOSE_PROJECT,HEALTH_URL,READY_URL
          script: |
            set -euo pipefail

            DEPLOY_PATH="${VPS_DEPLOY_ROOT}/${DEPLOY_PATH_SUFFIX}"

            test -d "${DEPLOY_PATH}"
            cd "${DEPLOY_PATH}"

            test -f .env
            test -s .env
            test -f docker-compose.yml
            test -s docker-compose.yml

            mv -f docker-compose.production.yml docker-compose.yml

            if grep -q '^FOLKSDO_IAM_IMAGE_TAG=' .env; then
              sed -i \
                "s|^FOLKSDO_IAM_IMAGE_TAG=.*|FOLKSDO_IAM_IMAGE_TAG=${IMAGE_TAG}|" \
                .env
            else
              printf \
                '\nFOLKSDO_IAM_IMAGE_TAG=%s\n' \
                "${IMAGE_TAG}" >> .env
            fi

            docker compose \
              --project-name "${COMPOSE_PROJECT}" \
              config --quiet

            docker compose \
              --project-name "${COMPOSE_PROJECT}" \
              pull

            docker compose \
              --project-name "${COMPOSE_PROJECT}" \
              up -d --remove-orphans

            for URL in "${HEALTH_URL}" "${READY_URL}"; do
              passed=false

              for attempt in $(seq 1 30); do
                if curl \
                  --fail \
                  --silent \
                  --show-error \
                  "${URL}" >/dev/null; then
                  passed=true
                  break
                fi

                sleep 5
              done

              if [ "${passed}" != "true" ]; then
                docker compose \
                  --project-name "${COMPOSE_PROJECT}" \
                  ps

                docker compose \
                  --project-name "${COMPOSE_PROJECT}" \
                  logs --tail=200 api

                exit 1
              fi
            done

            docker compose \
              --project-name "${COMPOSE_PROJECT}" \
              ps

  production-smoke:
    name: Production Smoke
    runs-on: ubuntu-latest
    needs: [resolve-certified-release, deploy-production]

    environment:
      name: production
      url: ${{ vars.IAM_PRODUCTION_BASE_URL }}

    steps:
      - name: Verify public production IAM
        shell: bash
        env:
          PRODUCTION_BASE_URL: ${{ vars.IAM_PRODUCTION_BASE_URL }}
        run: |
          set -euo pipefail

          test -n "${PRODUCTION_BASE_URL}"

          curl \
            --fail \
            --silent \
            --show-error \
            "${PRODUCTION_BASE_URL}/health/live" \
            >/dev/null

          curl \
            --fail \
            --silent \
            --show-error \
            "${PRODUCTION_BASE_URL}/health/ready" \
            >/dev/null

          echo "Folksdo IAM production smoke passed."

      - name: Production release summary
        shell: bash
        run: |
          {
            echo "## Folksdo IAM Production"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Environment | production |"
            echo "| Endpoint | ${{ vars.IAM_PRODUCTION_BASE_URL }} |"
            echo "| Main Commit | ${{ github.sha }} |"
            echo "| Certified Source | ${{ needs.resolve-certified-release.outputs.source_commit }} |"
            echo "| Image | ${{ needs.resolve-certified-release.outputs.image_ref }} |"
            echo "| Digest | ${{ needs.resolve-certified-release.outputs.image_digest }} |"
            echo "| Health | Passed |"
            echo "| Readiness | Passed |"
            echo "| Production Smoke | Passed |"
          } >> "${GITHUB_STEP_SUMMARY}"